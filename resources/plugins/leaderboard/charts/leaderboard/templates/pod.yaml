apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.podName }}
  labels:
    app: {{ .Chart.Name }}
    {{ if eq .Values.addAsCaddyWebsite true }}caddy-website: "true"{{ end }}
spec:
  restartPolicy: Never
  containers:
  - name: {{ .Values.podName }}-container
    image: nginx:latest
    resources: {}
    ports:
      - containerPort: 80
